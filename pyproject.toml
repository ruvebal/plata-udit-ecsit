[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plata-extract"
version = "0.2.0"
description = "marker-pdf wrapper for Digital Humanities PDF extraction"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "PLATA Project / UDIT / ECSiT Research Group"},
    {name = "Rubén Vega Balbás PhD (ECSIT - UDIT)", email = "ruben.vega@udit.es"},
]
keywords = [
    "pdf", "extraction", "markdown", "digital-humanities",
    "heritage", "ocr", "marker-pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "PyMuPDF",
    "pymupdf4llm",
    "pymupdf-layout",
    "docling",
]

[project.optional-dependencies]
neural = [
    "marker-pdf",
]
full = [
    "marker-pdf[full]",
]
dev = [
    "pytest",
    "black",
    "mypy",
]

[project.scripts]
plata-extract = "plata_extract.cli:main"

[project.urls]
Repository = "https://github.com/ruvebal/plata"

[tool.setuptools.packages.find]
include = ["plata_extract*"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
